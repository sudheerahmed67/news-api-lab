
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily News Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Daily News Portal</h1>
        <p>Get the Latest News Around the World</p>
    </header>

    <main>
        <div class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search news..."
            >

            <select id="categorySelect">
                <option value="general">General</option>
                <option value="technology">Technology</option>
                <option value="business">Business</option>
                <option value="sports">Sports</option>
                <option value="science">Science</option>
                <option value="health">Health</option>
                <option value="entertainment">Entertainment</option>
            </select>

            <button id="searchButton">Search News</button>
            <button id="topButton">Top Headlines</button>

        </div>

        <p id="status">Click Top Headlines to load news.</p>

        <section id="newsContainer"></section>
    </main>

    <footer>
        <p>Web Engineering Lab 09 | Sudheer Ahmed | CMS ID: 513355</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
